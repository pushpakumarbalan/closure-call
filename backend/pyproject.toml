[project]
name = "closurecall"
version = "0.1.0"
description = "Closure Call: weather-driven facility decisions and notification (Hack Midwest 2026 / USDA AI Challenge)"
requires-python = ">=3.11"
dependencies = [
    "strands-agents[openai]>=1.59.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[tool.setuptools]
packages = ["app"]
